<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="darkreader-lock">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HAND Pitch Screen</title>
<link rel="icon" href="https://framerusercontent.com/images/8L66Ak04owTI3HRCzaubpVoOoV4.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; cursor: none; }
  /* 1920x1080 stage, scaled to fit any screen (same pixel grid as the film) */
  .stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; overflow: hidden; background: #0b0b0c; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; }
  .card { position: absolute; inset: 0; background: #0b0b0c; opacity: 0; }
  .card.on { opacity: 1; }
  /* the end card, matched to the film's last frame */
  .word { position: absolute; left: 340px; top: 446px; height: 180px; font-size: 150px; font-weight: 700; line-height: 1; white-space: pre; letter-spacing: 0; }
  .word .a { color: #f5f2ec; } .word .b { color: #ffcc00; }
  .slot { position: absolute; left: 1482px; top: 452px; width: 104px; height: 152px; border: 5px dashed #ffcc00; border-radius: 16px;
          display: grid; place-items: center; color: #ffcc00; font-size: 104px; font-weight: 700; line-height: 1;
          opacity: 0; transition: opacity .4s ease .25s; }
  .card.on .slot { opacity: 1; animation: pulse 1.3s ease-in-out .7s infinite; }
  .slot.off { display: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.96); } }
  @keyframes blink { 50% { opacity: 0; } }
  .lastT { position: absolute; left: 1492px; top: 446px; font-size: 150px; font-weight: 700; line-height: 1; color: #ffcc00; opacity: 0; transform: scale(1.7); transform-origin: 50% 60%; }
  .lastT.in { transition: opacity .2s linear .78s, transform .5s cubic-bezier(.2,1.5,.4,1) .78s; opacity: 1; transform: none; }
  /* the last hand: falls in from above with its T painted on, lands over the gap, then hovers */
  .handfall { position: absolute; left: 1252px; top: 118px; width: 660px; opacity: 0; transform: translateY(-1000px) rotate(-16deg);
              filter: drop-shadow(0 34px 44px rgba(0,0,0,.6)); will-change: transform; }
  .handfall.in { opacity: 1; animation: fall .95s forwards, bob 3.4s ease-in-out .95s infinite; }
  @keyframes fall {
    0%   { transform: translateY(-1000px) rotate(-16deg); animation-timing-function: cubic-bezier(.55,0,.9,.55); }
    72%  { transform: translateY(26px) rotate(4deg);     animation-timing-function: cubic-bezier(.2,.8,.4,1); }
    86%  { transform: translateY(-10px) rotate(-1.5deg); animation-timing-function: ease-in-out; }
    100% { transform: translateY(0) rotate(0deg); } }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-12px) rotate(.8deg); } }
  .note { position: absolute; left: 0; right: 0; top: 672px; text-align: center; font-size: 50px; font-weight: 600; color: #c9c5be; transition: color .4s; }
  .note.hit { color: #f5f2ec; }
  /* the browser bar that types the link */
  .browser { position: absolute; left: 360px; right: 360px; top: 800px; height: 96px; border-radius: 18px; background: #ececec; color: #111;
             display: flex; align-items: center; gap: 22px; padding: 0 32px; font-size: 44px; font-weight: 500; opacity: 0; transform: translateY(40px);
             transition: opacity .35s ease, transform .5s cubic-bezier(.16,1,.3,1); }
  .browser.on { opacity: 1; transform: translateY(0); }
  .dots { display: flex; gap: 10px; } .dots i { width: 16px; height: 16px; border-radius: 50%; background: #ff5f57; }
  .dots i:nth-child(2) { background: #febc2e; } .dots i:nth-child(3) { background: #28c840; }
  .caret { width: 3px; height: 50px; background: #111; animation: blink 1s steps(1) infinite; margin-left: -18px; }
  .hint { position: fixed; right: 18px; bottom: 14px; font: 500 13px "Helvetica Neue", Arial, sans-serif; color: #444; letter-spacing: .02em; transition: opacity .4s; }
  /* the web: the link opens here, inside the pitch screen, so full screen and sound carry on */
  .web { position: fixed; inset: 0; z-index: 5; background: #0b0b0c; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity .45s ease; }
  .web.on { opacity: 1; pointer-events: auto; }
  .chrome { flex: none; background: #dee1e6; border-bottom: 1px solid #d0d0d0; position: relative; }
  .tabs { height: 40px; display: flex; align-items: flex-end; padding: 0 12px 0 16px; }
  .tabs .dots { align-self: center; margin-right: 22px; } .chrome .dots i { width: 12px; height: 12px; }
  .tab { height: 32px; width: 240px; border-radius: 9px 9px 0 0; padding: 0 12px; display: flex; align-items: center; gap: 9px; flex: none;
         font: 500 13px -apple-system, "Helvetica Neue", Arial, sans-serif; color: #45484c; white-space: nowrap; overflow: hidden; }
  .tab.active { background: #fff; color: #1f1f1f; }
  .tab img, .tab .spin { width: 16px; height: 16px; flex: none; }
  .tab span { overflow: hidden; text-overflow: ellipsis; }
  .tab .x { margin-left: auto; color: #777; font-size: 15px; }
  .tab + .tab:not(.active)::before { content: ""; width: 1px; height: 18px; background: #a9acb1; margin: 0 6px 0 -12px; }
  .spin { border: 2px solid #c4c7cc; border-top-color: #2f7cf6; border-radius: 50%; animation: spin .7s linear infinite; box-sizing: border-box; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tab.new { animation: tabin .28s cubic-bezier(.2,.8,.3,1); }
  @keyframes tabin { from { width: 0; padding: 0; opacity: 0; } to { width: 240px; opacity: 1; } }
  .toolbar { height: 44px; background: #fff; display: flex; align-items: center; padding: 0 16px; }
  .url { flex: 1; max-width: 900px; margin: 0 auto; height: 32px; border-radius: 16px; background: #f1f3f4; color: #222; display: flex; align-items: center; gap: 9px; padding: 0 16px;
         font: 400 15px -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .load { position: absolute; left: 0; top: 84px; z-index: 2; height: 3px; width: 0; background: #2f7cf6; transition: width 1.2s cubic-bezier(.2,.8,.3,1), opacity .3s; }
  .web iframe { flex: 1; width: 100%; border: 0; background: #0b0b0c; opacity: 0; transition: opacity .25s; }
  .web iframe.ready { opacity: 1; }
  .browser.enter { background: #fff; box-shadow: 0 0 0 4px rgba(47,124,246,.55); }
  /* one-time setup click: gives the page permission to play sound, goes full screen */
  .arm { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.86); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
         font: 500 22px "Helvetica Neue", Arial, sans-serif; color: #ddd; cursor: pointer; text-align: center; padding: 24px; }
  .arm b { font-size: 40px; color: #fff; font-weight: 700; }
  .arm small { color: #888; font-size: 16px; }
  .arm.off { display: none; }
  .rdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #555; margin-right: 7px; vertical-align: 1px; }
  .rdot.ok { background: #2bb24c; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <video id="film" src="hand_intro.mp4" preload="auto" playsinline></video>
  <div class="card" id="card">
    <div class="word"><span class="a">bit.ly/</span><span class="b">PULLITOU</span></div>
    <div class="slot" id="slot">?</div>
    <img class="handfall" id="handfall" src="hand_T.png" alt="">
    <div class="lastT" id="lastT">T</div>
    <div class="note" id="note">9 hands found. <b style="color:#ffcc00">1 still missing.</b></div>
    <div class="browser" id="browser"><div class="dots"><i></i><i></i><i></i></div><span id="typed"></span><span class="caret"></span></div>
  </div>
</div>
<div class="web" id="web">
  <div class="chrome">
    <div class="tabs" id="tabs"><div class="dots"><i></i><i></i><i></i></div><div class="tab active" id="tab0"><span class="spin" id="tab0i"></span><span id="tab0t">bit.ly/PULLITOUT</span><span class="x">×</span></div></div>
    <div class="toolbar"><div class="url"><span class="lock"></span><span id="url">bit.ly/PULLITOUT</span></div></div>
  </div>
  <div class="load" id="load"></div>
  <iframe id="site" allow="autoplay; fullscreen" title="HAND"></iframe>
</div>
<div class="arm" id="arm"><b>HAND pitch screen</b>Click once to turn sound on and go full screen.<small><span class="rdot" id="rdot0"></span><span id="rtext0">Connecting to the phone remote…</span></small></div>
<div class="hint" id="hint"><span class="rdot" id="rdot"></span><span id="htext">→ start film · F full screen</span></div>
<script>
/* Run of show (phone remote at /pitch/remote/, or → on the laptop / a clicker):
   click 1  plays the film (sound on). It ends on bit.ly/PULLITOU_ by itself.
   click 2  the last hand (with a T painted on) falls in and the T lands in the link
   click 3  types bit.ly/PULLITOUT, opens /HAND, a mouse clicks HAND-OFF by itself, the premiere starts
   after    the remote pauses / plays the premiere
   ←  steps back · R restarts · F full screen */
const CONFIG = {
  typed: "bit.ly/PULLITOUT",
  openLink: "/HAND/?auto=1",                      // where bit.ly/PULLITOUT should land
  shown: { "/HAND/": "eudaifilms.com/HAND", "/HAND/premiere/": "eudaifilms.com/HAND/premiere" },
  relay: "https://ntfy.sh/", topic: "hand-pitch-w619kl6zuqvai5"
};
const $ = id => document.getElementById(id);
const stage = $("stage"), film = $("film"), card = $("card"), slot = $("slot"), lastT = $("lastT"), note = $("note"), handfall = $("handfall");
const browser = $("browser"), typed = $("typed"), hint = $("hint"), htext = $("htext"), web = $("web"), site = $("site"), url = $("url"), load = $("load"), arm = $("arm");
function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transformOrigin = "50% 50%"; stage.style.transform = `translate(-50%, -50%) scale(${s})`; }
addEventListener("resize", fit); fit();

// steps: 0 ready · 1 film · 2 end card · 3 T hand landed · 4 link typing → /HAND → HAND-OFF (runs by itself) · 5 premiere
let step = 0, typer = null, timers = [];
const later = (f, ms) => timers.push(setTimeout(f, ms));
function clearTimers() { timers.forEach(clearTimeout); timers = []; clearInterval(typer); typer = null; }
function render() {
  card.classList.toggle("on", step >= 2);
  slot.classList.toggle("off", step >= 3);
  if (step >= 3) { lastT.classList.add("in"); handfall.classList.add("in"); note.textContent = "10 hands found."; note.classList.add("hit"); }
  else { lastT.classList.remove("in"); handfall.classList.remove("in"); note.innerHTML = '9 hands found. <b style="color:#ffcc00">1 still missing.</b>'; note.classList.remove("hit"); }
  browser.classList.toggle("on", step >= 4);
  if (step < 4) { typed.textContent = ""; browser.classList.remove("enter"); closeWeb(); }
  htext.textContent = ["→ start film · F full screen", "", "→ drop the T hand", "→ open the link", "", ""][step];
  hint.style.opacity = (step === 1 || step >= 4) ? 0 : 1;
}
function openLink() {
  let i = 0; typed.textContent = "";
  typer = setInterval(() => {
    i++; typed.textContent = CONFIG.typed.slice(0, i);
    if (i >= CONFIG.typed.length) {
      clearInterval(typer); typer = null;
      later(() => browser.classList.add("enter"), 450);          // "Enter"
      later(openWeb, 750);
    }
  }, 75);
}
function openWeb() {
  $("tab0t").textContent = CONFIG.typed; $("tab0i").outerHTML = '<span class="spin" id="tab0i"></span>';
  url.textContent = CONFIG.typed; site.classList.remove("ready"); load.style.transition = "none"; load.style.width = "0"; load.style.opacity = 1;
  web.classList.add("on");
  requestAnimationFrame(() => { load.style.transition = ""; load.style.width = "70%"; });
  site.src = CONFIG.openLink;
}
function closeWeb() { document.querySelectorAll(".tab.extra").forEach(t => t.remove());
  if (!web.classList.contains("on") && !site.getAttribute("src")) return; web.classList.remove("on"); site.classList.remove("ready"); site.removeAttribute("src"); site.src = "about:blank"; }
site.addEventListener("load", () => {
  let path = ""; try { path = site.contentWindow.location.pathname; } catch (e) {}
  if (!CONFIG.shown[path]) return;
  url.textContent = CONFIG.shown[path]; load.style.width = "100%";
  try { $("tab0t").textContent = site.contentDocument.title; } catch (e) {}
  $("tab0i").outerHTML = '<img id="tab0i" src="https://framerusercontent.com/images/8L66Ak04owTI3HRCzaubpVoOoV4.png" alt="">'; setTimeout(() => load.style.opacity = 0, 350);
  site.classList.add("ready");
  if (path.includes("premiere") && step === 4) { step = 5; render(); publish(); }
});
// the HAND page's mouse opens "Films" in a new tab: show it appear in the tab strip
addEventListener("message", e => {
  if (e.origin !== location.origin || !e.data || e.data.hand !== "newtab") return;
  const t = document.createElement("div"); t.className = "tab extra new";
  t.innerHTML = '<span class="spin"></span><span></span><span class="x">×</span>'; t.children[1].textContent = "Loading…";
  $("tabs").appendChild(t);
  setTimeout(() => { t.children[0].outerHTML = '<img src="https://framerusercontent.com/images/8L66Ak04owTI3HRCzaubpVoOoV4.png" alt="">'; t.children[1].textContent = e.data.title; }, 900);
});
function premiereVideo() { try { return site.contentDocument.querySelector("video"); } catch (e) { return null; } }
film.addEventListener("ended", () => { if (step === 1) { step = 2; render(); publish(); } });

function next() {
  if (step === 0) { step = 1; render(); film.currentTime = 0; film.muted = false; film.play().catch(() => { film.muted = true; film.play(); }); }
  else if (step === 1) { film.pause(); step = 2; render(); }        // skip the film if needed
  else if (step === 2) { step = 3; render(); }
  else if (step === 3) { step = 4; render(); openLink(); }
  else if (step === 4) { return; }                                  // running by itself
  else if (step === 5) { const v = premiereVideo(); if (v) { v.paused ? v.play() : v.pause(); } }
  publish();
}
function back() {
  clearTimers();
  if (step === 0) return;
  if (step <= 2) { film.pause(); film.currentTime = 0; step = 0; }
  else if (step >= 4) { step = 3; }
  else step--;
  render(); publish();
}
function restart() { clearTimers(); film.pause(); film.currentTime = 0; step = 0; render(); publish(); }

// ---- phone remote: commands arrive over a tiny public relay (ntfy.sh), state goes back the same way ----
const seen = new Set(); let es = null; const me = Math.random().toString(36).slice(2); let passive = false;   // passive: another laptop page took over
function publish() {
  const v = premiereVideo();
  const st = { step, at: Date.now(), filmLeft: step === 1 ? Math.max(0, (film.duration || 21) - film.currentTime) : 0, paused: v ? v.paused : null, armed: !arm.classList.contains("off") ? false : true };
  fetch(CONFIG.relay + CONFIG.topic + "-state", { method: "POST", body: JSON.stringify(st) }).catch(() => {});
}
function setRemote(ok) { $("rdot").classList.toggle("ok", ok); $("rdot0").classList.toggle("ok", ok); $("rtext0").textContent = ok ? "Phone remote ready" : "Connecting to the phone remote…"; }
function listen() {
  es = new EventSource(CONFIG.relay + CONFIG.topic + "-cmd/sse");
  es.onopen = () => setRemote(true);
  es.onerror = () => setRemote(false);
  es.onmessage = e => {
    let m; try { const d = JSON.parse(e.data); if (d.event && d.event !== "message") return; m = JSON.parse(d.message); } catch (err) { return; }
    if (!m || seen.has(m.id) || Date.now() - m.t > 30000) return; seen.add(m.id);
    if (m.act === "claim") { passive = m.who !== me; setRemote(!passive); if (passive) $("rtext0").textContent = "Another pitch screen has the remote"; return; }
    if (passive) return;
    if (m.act === "next" && m.from === step) next();
    else if (m.act === "back" && m.from === step) back();
    else if (m.act === "restart") restart();
    else publish();                                                 // ping, or a stale tap: just report where we are
  };
}
listen(); publish();
setInterval(() => { if (es && es.readyState === 2) listen(); }, 5000);

// one real click on the laptop first: lets the film and premiere play with sound, and goes full screen
function doArm(e) {
  if (arm.classList.contains("off")) return false;
  arm.classList.add("off"); passive = false; setRemote(true);
  fetch(CONFIG.relay + CONFIG.topic + "-cmd", { method: "POST", body: JSON.stringify({ id: me + "c", t: Date.now(), act: "claim", who: me }) }).catch(() => {});
  publish();
  if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  return true;
}
arm.addEventListener("click", e => { e.stopPropagation(); doArm(); });
addEventListener("keydown", e => {
  if (doArm()) { if (e.key !== "ArrowRight" && e.key !== " ") return; }
  if (["ArrowRight", " ", "Enter", "PageDown"].includes(e.key)) { e.preventDefault(); next(); }
  else if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); back(); }
  else if (e.key === "r" || e.key === "R") restart();
  else if (e.key === "f" || e.key === "F") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
});
stage.addEventListener("click", next);
render();
</script>
</body>
</html>
