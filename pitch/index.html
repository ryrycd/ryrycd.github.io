<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HAND Pitch Screen</title>
<link rel="icon" href="https://framerusercontent.com/images/8L66Ak04owTI3HRCzaubpVoOoV4.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; cursor: none; }
  /* 1920x1080 stage, scaled to fit any screen (same pixel grid as the film) */
  .stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; overflow: hidden; background: #0b0b0c; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; }
  .card { position: absolute; inset: 0; background: #0b0b0c; opacity: 0; }
  .card.on { opacity: 1; }
  /* the end card, matched to the film's last frame */
  .word { position: absolute; left: 340px; top: 446px; height: 180px; font-size: 150px; font-weight: 700; line-height: 1; white-space: pre; letter-spacing: 0; }
  .word .a { color: #f5f2ec; } .word .b { color: #ffcc00; }
  .slot { position: absolute; left: 1496px; top: 602px; width: 80px; height: 12px; background: #ffcc00; animation: blink 0.67s steps(1) infinite; }
  .slot.off { display: none; }
  @keyframes blink { 50% { opacity: 0; } }
  .lastT { position: absolute; left: 1492px; top: 446px; font-size: 150px; font-weight: 700; line-height: 1; color: #ffcc00; transform: translateY(-900px); }
  .lastT.in { transition: transform .9s cubic-bezier(.2,.9,.25,1); transform: translateY(0); }
  .note { position: absolute; left: 0; right: 0; top: 679px; text-align: center; font-size: 40px; font-weight: 500; color: #96928c; transition: color .4s; }
  .note.hit { color: #f5f2ec; }
  /* the browser bar that types the link */
  .browser { position: absolute; left: 360px; right: 360px; top: 800px; height: 96px; border-radius: 18px; background: #ececec; color: #111;
             display: flex; align-items: center; gap: 22px; padding: 0 32px; font-size: 44px; font-weight: 500; opacity: 0; transform: translateY(40px);
             transition: opacity .35s ease, transform .5s cubic-bezier(.16,1,.3,1); }
  .browser.on { opacity: 1; transform: translateY(0); }
  .dots { display: flex; gap: 10px; } .dots i { width: 16px; height: 16px; border-radius: 50%; background: #ff5f57; }
  .dots i:nth-child(2) { background: #febc2e; } .dots i:nth-child(3) { background: #28c840; }
  .caret { width: 3px; height: 50px; background: #111; animation: blink 1s steps(1) infinite; margin-left: -18px; }
  .hint { position: fixed; right: 18px; bottom: 14px; font: 500 13px "Helvetica Neue", Arial, sans-serif; color: #444; letter-spacing: .02em; transition: opacity .4s; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <video id="film" src="hand_intro.mp4" preload="auto" playsinline></video>
  <div class="card" id="card">
    <div class="word"><span class="a">bit.ly/</span><span class="b">PULLITOU</span></div>
    <div class="slot" id="slot"></div>
    <div class="lastT" id="lastT">T</div>
    <div class="note" id="note">9 hands found. 1 still missing.</div>
    <div class="browser" id="browser"><div class="dots"><i></i><i></i><i></i></div><span id="typed"></span><span class="caret"></span></div>
  </div>
</div>
<div class="hint" id="hint">→ start film · F full screen</div>
<script>
/* Run of show:
   →  plays the film (sound on). It ends on bit.ly/PULLITOU_ with one letter missing.
   (the last hand balloon comes down from the ceiling, with a T on its tag)
   →  the T drops into place
   →  the link types itself into a browser bar
   →  opens the hidden /HAND page (the splinter, then HAND-OFF to the premiere)
   ←  steps back · R restarts · F full screen */
const CONFIG = {
  typed: "bit.ly/PULLITOUT",
  // bit.ly/PULLITOUT currently points at Eudai's film page; once it's repointed in Bitly this can be "https://bit.ly/PULLITOUT"
  openLink: "https://ryrycd.github.io/HAND/"
};
const stage = document.getElementById("stage"), film = document.getElementById("film"), card = document.getElementById("card");
const slot = document.getElementById("slot"), lastT = document.getElementById("lastT"), note = document.getElementById("note");
const browser = document.getElementById("browser"), typed = document.getElementById("typed"), hint = document.getElementById("hint");
function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transformOrigin = "50% 50%"; stage.style.transform = `translate(-50%, -50%) scale(${s})`; }
addEventListener("resize", fit); fit();

let step = 0, typer = null;
function render() {
  card.classList.toggle("on", step >= 2);
  slot.classList.toggle("off", step >= 3);
  if (step >= 3) { lastT.classList.add("in"); note.textContent = "10 hands found."; note.classList.add("hit"); }
  else { lastT.classList.remove("in"); note.textContent = "9 hands found. 1 still missing."; note.classList.remove("hit"); }
  browser.classList.toggle("on", step >= 4);
  if (step >= 4 && !typer && typed.textContent !== CONFIG.typed) typeLink();
  if (step < 4) { clearInterval(typer); typer = null; typed.textContent = ""; }
  hint.textContent = ["→ start film · F full screen", "", "→ drop the last letter", "→ type the link", "→ open it"][Math.min(step, 4)];
  hint.style.opacity = step === 1 ? 0 : 1;
}
function typeLink() {
  let i = 0; typed.textContent = "";
  typer = setInterval(() => { i++; typed.textContent = CONFIG.typed.slice(0, i); if (i >= CONFIG.typed.length) { clearInterval(typer); typer = null; } }, 70);
}
film.addEventListener("ended", () => { if (step === 1) { step = 2; render(); } });
function next() {
  if (step === 0) { step = 1; render(); film.currentTime = 0; film.muted = false; film.play().catch(() => { film.muted = true; film.play(); }); return; }
  if (step === 1) { film.pause(); step = 2; render(); return; }        // skip the film if needed
  if (step < 4) { step++; render(); return; }
  location.href = CONFIG.openLink;
}
function back() {
  if (step === 0) return;
  if (step <= 2) { film.pause(); film.currentTime = 0; step = 0; render(); return; }
  step--; render();
}
addEventListener("keydown", e => {
  if (["ArrowRight", " ", "Enter", "PageDown"].includes(e.key)) { e.preventDefault(); next(); }
  else if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); back(); }
  else if (e.key === "r" || e.key === "R") { film.pause(); film.currentTime = 0; step = 0; render(); }
  else if (e.key === "f" || e.key === "F") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
});
addEventListener("click", next);
render();
</script>
</body>
</html>
