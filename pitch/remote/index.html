<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="darkreader-lock">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HAND Remote</title>
<link rel="icon" href="https://framerusercontent.com/images/8L66Ak04owTI3HRCzaubpVoOoV4.png">
<style>
  :root { --bg: #0b0b0c; --card: #17171a; --line: #2a2a2e; --ink: #f5f2ec; --dim: #8d8a85; --yel: #ffcc00; --ok: #2bb24c; --red: #e5484d; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--ink); font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  body { padding: 0 16px max(16px, env(safe-area-inset-bottom)); user-select: none; -webkit-user-select: none; }
  .top { position: sticky; top: 0; z-index: 3; background: var(--bg); padding: max(12px, env(safe-area-inset-top)) 0 10px; }
  header { display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: var(--dim); margin-bottom: 10px; }
  header b { color: var(--ink); font-size: 17px; letter-spacing: -.01em; }
  .conn { display: flex; align-items: center; gap: 7px; text-align: right; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; flex: none; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 4px rgba(43,178,76,.18); } .dot.bad { background: var(--red); }
  .big { width: 100%; min-height: 128px; border: 0; border-radius: 22px; background: var(--yel); color: #111; display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
         padding: 16px 20px; text-align: left; font: inherit; transition: transform .08s, background .2s, opacity .2s; touch-action: manipulation; }
  .big:active { transform: scale(.98); }
  .big .n { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .6; }
  .big .t { font-size: 32px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; margin-top: 3px; }
  .big .d { font-size: 15px; font-weight: 500; line-height: 1.3; margin-top: 6px; opacity: .78; }
  .big.wait { background: var(--card); color: var(--ink); }
  .big.sent { opacity: .55; }
  .msg { min-height: 18px; font-size: 13px; color: var(--dim); text-align: center; margin-top: 6px; }
  .msg.err { color: #ff8a8d; }

  /* the script / teleprompter */
  .sec { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 2px 8px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--yel); }
  .sec .clock { font-variant-numeric: tabular-nums; color: var(--dim); letter-spacing: .04em; }
  .r { display: grid; grid-template-columns: 40px 1fr; gap: 0 10px; padding: 12px 12px 13px; margin: 7px 0; border-radius: 14px; background: var(--card); border: 1px solid transparent; transition: opacity .3s, border-color .2s, background .2s; }
  .r .tm { font-size: 13px; font-weight: 700; color: #6b6964; font-variant-numeric: tabular-nums; padding-top: 3px; }
  .r .cue { font-size: 13px; line-height: 1.35; color: var(--dim); }
  .r .who { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); margin-bottom: 2px; }
  .r .say { font-size: 21px; line-height: 1.3; font-weight: 600; letter-spacing: -.01em; margin-top: 3px; }
  .r .say.quiet { font-size: 16px; font-weight: 500; font-style: italic; color: var(--dim); }
  .r.other .say { font-size: 17px; font-weight: 500; color: #cfcac2; }
  .r.click { background: #221d08; border-color: #4a3d00; }
  .r.click .say { color: var(--yel); font-size: 17px; font-weight: 800; letter-spacing: .02em; text-transform: uppercase; }
  .r.now { border-color: var(--yel); background: #1f1c12; }
  .r.now .tm { color: var(--yel); }
  .r.done { opacity: .38; }
  .foot { display: flex; gap: 10px; margin-top: 18px; }
  .small { flex: 1; height: 48px; border-radius: 14px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 600 15px -apple-system, "Helvetica Neue", Arial, sans-serif; touch-action: manipulation; }
  .small:active { background: var(--card); }
  .tip { color: #66635e; font-size: 12.5px; line-height: 1.45; margin: 14px 2px 0; }
</style>
</head>
<body>
<div class="top">
  <header><b>HAND remote</b><span class="conn"><span class="dot" id="dot"></span><span id="conn">Connecting…</span></span></header>
  <button class="big wait" id="big"><span class="n" id="bn">&nbsp;</span><span class="t" id="bt">Connecting…</span><span class="d" id="bd">Open ryrycd.github.io/pitch on the laptop.</span></button>
  <div class="msg" id="msg"></div>
</div>

<div id="script"></div>

<div class="foot"><button class="small" id="back">← Back one step</button><button class="small" id="restart">Restart</button></div>
<p class="tip">The highlighted line follows the laptop: it moves on by itself while the film and the website run. Times are from your click. If the phone loses the laptop, press → on the laptop instead.</p>

<script>
const RELAY = "https://ntfy.sh/", TOPIC = "hand-pitch-w619kl6zuqvai5";
const FILM = 20.92;                                   // film length (s)
const $ = id => document.getElementById(id);
const big = $("big"), msg = $("msg");

// ---------------- the script (times measured on the real pages) ----------------
// part: "pitch" times count from click 1 · "qa" times count from click 3 · pre: said before click 3
const SCRIPT = [
  { part: "pitch", at: 0,    click: "Click 1 · Start the film", cue: "The 21-second film plays. Nobody talks." },
  { part: "pitch", at: 21,   cue: "Film ends on bit.ly/PULLITOU_ · “9 hands found. 1 still missing.”",
                             say: "Nine hands. Nine cities. Nine letters. But one hand is still missing… the biggest one." },
  { part: "pitch", at: 28,   click: "Click 2 · as you come down from the ceiling", cue: "The T hand falls in. The T lands at 0:29: “10 hands found.” The pitch ends at 0:30." },

  { part: "qa", pre: true,   say: "Any questions?" },
  { part: "qa", pre: true,   who: "Moje", other: true, say: "First, what does that bit.ly link lead to, and second, how does this help promote my company, Eudai Films?" },
  { part: "qa", pre: true,   say: "Great questions. Let me show you.", cue: "Press click 3 on “show you.”" },
  { part: "qa", at: 0,       click: "Click 3 · Open the link", cue: "From here it runs by itself. Just talk." },
  { part: "qa", at: 0.2,     cue: "The link types itself. Your site opens at 0:02.",          say: "It goes to your website, not YouTube." },
  { part: "qa", at: 3.0,     cue: "“You found the hand.” The hand throbs.",                     say: "To a hidden page, where you pull it out." },
  { part: "qa", at: 5.2,     cue: "The splinter pops out and blood pours.",                     say: "(Beat. Let the room react.)", quiet: true },
  { part: "qa", at: 5.8,     cue: "The mouse right-clicks Films and opens it in a new tab (0:08).", say: "Second: they're on your site, so they find your other films." },
  { part: "qa", at: 9.8,     cue: "The mouse clicks HAND-OFF (0:10). The premiere opens (0:11).", say: "Then one click, and they're at your premiere." },
  { part: "qa", at: 12.8,    cue: "Premiere countdown and live chat.",                          say: "The hands get people talking. The link brings all of them to Eudai." },
  { part: "qa", at: 17.6,    cue: "The film starts.",                                           say: "Eudai Films. Stories that stay with you." }
];
function mmss(t) { t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); }
(function build() {
  const box = $("script"); let last = null;
  SCRIPT.forEach((r, i) => {
    if (r.part !== last) {
      last = r.part;
      const h = document.createElement("div"); h.className = "sec";
      h.innerHTML = r.part === "pitch" ? '<span>The pitch · 30 s</span><span class="clock" id="clock_pitch"></span>' : '<span>Q&amp;A · Moje’s question</span><span class="clock" id="clock_qa"></span>';
      box.appendChild(h);
    }
    const el = document.createElement("div"); el.className = "r" + (r.click ? " click" : "") + (r.other ? " other" : ""); el.id = "r" + i;
    const tm = r.pre ? "" : mmss(r.at);
    el.innerHTML = '<div class="tm"></div><div><div class="who"></div><div class="cue"></div><div class="say"></div></div>';
    el.querySelector(".tm").textContent = tm;
    if (r.who) el.querySelector(".who").textContent = r.who; else el.querySelector(".who").remove();
    if (r.click) { el.querySelector(".say").textContent = r.click; el.querySelector(".cue").textContent = r.cue || ""; el.querySelector(".say").after(el.querySelector(".cue")); }
    else { el.querySelector(".say").textContent = r.say || ""; if (r.quiet) el.querySelector(".say").classList.add("quiet"); if (r.cue) el.querySelector(".cue").textContent = r.cue; else el.querySelector(".cue").remove(); }
    if (r.pre && !r.who) el.querySelector(".tm").textContent = "You";
    box.appendChild(el);
  });
})();

// ---------------- the remote ----------------
const VIEW = {
  0: { n: "Click 1 of 3", t: "Start the film", d: "21 s with sound. It stops on bit.ly/PULLITOU_ by itself." },
  1: { wait: true, n: "Film playing", t: "", d: "Nothing to click. Your line is at 0:21." },
  2: { n: "Click 2 of 3", t: "Drop the T hand", d: "At about 0:28, as you come down from the ceiling." },
  3: { n: "Click 3 of 3", t: "Open the link", d: "After Moje's question, on “Let me show you.”" },
  4: { wait: true, n: "Running by itself", t: "Just talk", d: "Your site → Films in a new tab → HAND-OFF → premiere." },
  5: { n: "Premiere is up", t: "Pause / play", d: "You're done. Optional: pauses or plays the premiere." }
};
let state = null, pending = null, pitchStart = null, qaStart = null, current = -1;

function post(act) {
  const m = { id: Math.random().toString(36).slice(2), t: Date.now(), act, from: state ? state.step : -1 };
  return fetch(RELAY + TOPIC + "-cmd", { method: "POST", body: JSON.stringify(m) });
}
function show() {
  if (!state) return;
  const v = VIEW[state.step] || VIEW[0];
  big.classList.toggle("wait", !!v.wait); big.classList.remove("sent");
  $("bn").textContent = v.n; $("bt").textContent = v.t; $("bd").textContent = v.d;
  $("dot").className = "dot ok"; $("conn").textContent = state.armed === false ? "Laptop connected (sound not on yet)" : "Laptop connected";
  if (state.armed === false && state.step === 0) { msg.textContent = "Click the laptop screen once so the film plays with sound."; msg.className = "msg"; }
}
function onState(st) {
  if (!st || typeof st.step !== "number") return;
  if (state && st.at < state.at) return;
  const now = Date.now(), prev = state ? state.step : null;
  state = st;
  // keep the teleprompter clocks in step with the laptop
  if (st.step === 0) { pitchStart = null; qaStart = null; }
  if (st.step === 1) pitchStart = now - (FILM - (st.filmLeft || FILM)) * 1000 - 300;
  if (st.step === 2 && prev !== 2 && prev !== 3) pitchStart = now - 21000;   // the film just ended: that's 0:21
  if (st.step <= 3) qaStart = null;
  if (st.step === 4 && prev !== 4) qaStart = now - 300;
  if (st.step === 5 && qaStart === null) qaStart = now - 11400;
  if (pending) { clearTimeout(pending); pending = null; msg.textContent = ""; msg.className = "msg"; }
  show(); tick();
}
function tick() {
  const now = Date.now(), step = state ? state.step : 0;
  const tp = pitchStart !== null ? (now - pitchStart) / 1000 : 0, tq = qaStart !== null ? (now - qaStart) / 1000 : 0;
  // film countdown on the big button
  if (step === 1) { const left = Math.ceil(FILM - tp); $("bt").textContent = left > 0 ? left + " s left in the film" : "Ending…"; }
  $("clock_pitch").textContent = step >= 1 && step <= 3 && pitchStart !== null ? mmss(Math.min(tp, 30)) : "";
  $("clock_qa").textContent = step >= 4 && qaStart !== null ? mmss(tq) : "";
  // which line is live
  let cur = [], next;
  const idx = (fn) => SCRIPT.map((r, i) => fn(r) ? i : -1).filter(i => i >= 0);
  if (step === 0) cur = [0];
  else if (step === 1 || step === 2) { const ok = idx(r => r.part === "pitch" && r.at - 0.4 <= tp); cur = [ok[ok.length - 1]]; if (step === 1 && cur[0] === 2) cur = [1]; }
  else if (step === 3) cur = idx(r => r.part === "qa" && r.pre).concat(idx(r => r.part === "qa" && r.click));
  else { const ok = idx(r => r.part === "qa" && !r.pre && r.at - 0.4 <= tq); cur = [ok[ok.length - 1]]; }
  const first = Math.min(...cur);
  SCRIPT.forEach((r, i) => {
    const el = $("r" + i);
    el.classList.toggle("now", cur.includes(i));
    el.classList.toggle("done", state !== null && i < first);
  });
  if (first !== current) { current = first; const el = $("r" + first); if (el) el.scrollIntoView({ behavior: "smooth", block: "center" }); }
}
setInterval(tick, 200);

function listen() {
  const es = new EventSource(RELAY + TOPIC + "-state/sse?since=latest");
  es.onmessage = e => { try { const d = JSON.parse(e.data); if (d.event && d.event !== "message") return; const st = JSON.parse(d.message);
    if (Date.now() - st.at > 20 * 60 * 1000) return;              // old state from a rehearsal: wait for the laptop's answer
    onState(st); } catch (err) {} };
  es.onerror = () => { if (es.readyState === 2) setTimeout(listen, 2000); };
}
listen();
post("ping");                                                       // ask the laptop where it is
setTimeout(() => { if (!state) { $("dot").className = "dot bad"; $("conn").textContent = "No laptop"; $("bt").textContent = "Laptop not found"; $("bd").textContent = "Open ryrycd.github.io/pitch on the laptop, then tap here to try again."; } }, 5000);

let wake = null;
async function keepAwake() { try { if (!wake && navigator.wakeLock) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => wake = null); } } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { wake = null; keepAwake(); post("ping"); } });

function send(act) {
  keepAwake();
  if (navigator.vibrate) navigator.vibrate(25);
  big.classList.add("sent"); msg.className = "msg"; msg.textContent = "Sent…";
  post(act).catch(() => { msg.textContent = "Couldn't reach the internet. Press → on the laptop instead."; msg.className = "msg err"; big.classList.remove("sent"); });
  clearTimeout(pending);
  pending = setTimeout(() => { pending = null; big.classList.remove("sent"); msg.textContent = "No answer from the laptop. Press → on the laptop instead."; msg.className = "msg err"; }, 4000);
}
big.addEventListener("click", () => {
  if (!state) { post("ping"); $("bt").textContent = "Connecting…"; return; }
  if (big.classList.contains("wait") || pending) return;
  send("next");
});
$("back").addEventListener("click", () => { if (state) send("back"); });
$("restart").addEventListener("click", () => { if (confirm("Restart the pitch screen from the top?")) send("restart"); });
</script>
</body>
</html>
